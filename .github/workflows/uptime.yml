# 每 15 分钟探活。失败打 secrets.ALERT_WEBHOOK（钉钉/企微机器人，待确认）。
# 已知限制：最短约 5 分钟且常延迟；仓库 60 天无活动会停；失败通知只发给最后改 cron 的人。
name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health
        env:
          QIYAN_URL: ${{ secrets.QIYAN_URL }}
        run: |
          set -euo pipefail
          URL="${QIYAN_URL:-https://qiyan-caxplsowco.cn-hangzhou.fcapp.run}"
          curl -fsS -m 20 "$URL/api/health" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok'); print('health ok ephemeral=', d.get('db',{}).get('ephemeral'))"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/wechat?signature=x&timestamp=1&nonce=1&echostr=p")
          test "$code" = "403"
          curl -fsS https://chengcanwu.github.io/AutoResearch/ | grep -q build-stamp
      - name: Record ephemeral and Pages vs API
        env:
          QIYAN_URL: ${{ secrets.QIYAN_URL }}
          QIYAN_REQUIRE_PERSISTENT: ${{ secrets.QIYAN_REQUIRE_PERSISTENT }}
        run: |
          set -euo pipefail
          URL="${QIYAN_URL:-https://qiyan-caxplsowco.cn-hangzhou.fcapp.run}"
          curl -fsS -m 20 "$URL/api/health" > /tmp/qiyan-health.json
          curl -fsS -m 20 https://chengcanwu.github.io/AutoResearch/ > /tmp/qiyan-pages.html
          python - <<'PY'
          import json, os, re, sys
          health = json.load(open("/tmp/qiyan-health.json", encoding="utf-8"))
          html = open("/tmp/qiyan-pages.html", encoding="utf-8", errors="replace").read()
          db = health.get("db") or {}
          ephemeral = db.get("ephemeral") if isinstance(db, dict) else None
          build = str((health.get("checks") or {}).get("build") or "")
          stamp = re.search(r"界面版本\s*<b>([^<]*)</b>", html)
          pages = stamp.group(1) if stamp else ""
          print(f"ephemeral={ephemeral} pages={pages} api_build={build}")
          print(f"::notice::ephemeral={ephemeral} pages={pages} api_build={build}")
          WN = r"(?<!\w)w\d+(?!\w)"
          api_w = sorted(set(re.findall(WN, build)))
          pages_w = sorted(set(re.findall(WN, pages)))
          if len(api_w) != 1:
              sys.exit("API 版本戳缺失或有歧义")
          if len(pages_w) != 1:
              sys.exit("Pages 版本戳缺失或有歧义")
          if api_w[0] != pages_w[0]:
              sys.exit(f"Pages 与 API 版本不一致：Pages {pages_w[0]} ≠ API {api_w[0]}")
          require = (os.environ.get("QIYAN_REQUIRE_PERSISTENT") or "").strip() in ("1", "true", "TRUE", "yes")
          if require and ephemeral is not False:
              sys.exit("生产持久化状态缺失或不是 false")
          PY
      - name: Alert
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: |
          if [ -n "$ALERT_WEBHOOK" ]; then
            curl -fsS -X POST "$ALERT_WEBHOOK" -H 'content-type: application/json' -d '{"msg":"qiyan uptime failed"}'
          else
            echo "ALERT_WEBHOOK 未设：钉钉群待确认，只在 Actions 里看红"
          fi
