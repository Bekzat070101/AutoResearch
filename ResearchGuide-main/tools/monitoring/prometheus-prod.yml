# 本机 + 生产：生产 /metrics 要 METRICS_TOKEN（Bearer）。把 token 单独写进 .runtime/metrics-token（不入库），这里只引用文件。
# 生产是函数计算单实例，60 秒抓一次足够；冷启动可能要十几秒，所以 scrape_timeout 给 25 秒。
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: qiyan
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8100"]
        labels:
          env: local

  - job_name: qiyan-prod
    scheme: https
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 25s
    authorization:
      type: Bearer
      credentials_file: .runtime/metrics-token
    static_configs:
      - targets: ["qiyan-caxplsowco.cn-hangzhou.fcapp.run"]   # 与 .github/workflows/uptime.yml 的 QIYAN_URL 一致；换域名两边一起改
        labels:
          env: prod
