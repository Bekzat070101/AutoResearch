# 本机：抓本地启研 API（server/main.py 默认 127.0.0.1:8100）。METRICS_TOKEN 没设时 /metrics 只放行本机，Prometheus 在本机抓就行。
# 要同时抓生产，用 prometheus-prod.yml（start-prometheus.zsh --prod）。
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: qiyan
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8100"]
        labels:
          env: local
