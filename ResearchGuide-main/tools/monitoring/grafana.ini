; 本机 Grafana：数据、日志、插件都放 .runtime/grafana（不入库）；provisioning 指向仓库里的 grafana/provisioning。
; start-grafana.zsh 会 export QIYAN_MON_DIR=本目录。
[paths]
data = $__env{QIYAN_MON_DIR}/.runtime/grafana/data
logs = $__env{QIYAN_MON_DIR}/.runtime/grafana/logs
plugins = $__env{QIYAN_MON_DIR}/.runtime/grafana/plugins
provisioning = $__env{QIYAN_MON_DIR}/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000
root_url = http://127.0.0.1:3000/

[database]
type = sqlite3
path = $__env{QIYAN_MON_DIR}/.runtime/grafana/data/grafana.db

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true

[log]
mode = console file
